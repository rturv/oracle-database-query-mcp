# Quarkus - Oracle JDBC Connection
quarkus.datasource.db-kind=oracle
quarkus.datasource.jdbc.url=${JDBC_URL:jdbc:oracle:thin:@localhost:1521/ORCLPDB1}
quarkus.datasource.jdbc.additional-jdbc-properties.charset=${ORACLE_CHARSET:UTF-8}
quarkus.datasource.jdbc.additional-jdbc-properties."oracle.jdbc.timezoneAsRegion"=false
quarkus.datasource.username=${JDBC_USER:mcp_user}
quarkus.datasource.password=${JDBC_PASSWORD:password}

# Quarkus MCP Server Configuration
quarkus.mcp.server.name=oracle-mcp-server
quarkus.mcp.server.version=1.0.0
quarkus.banner.enabled=false

# Native image: include all charsets (required for Oracle JDBC timezone internals)
quarkus.native.add-all-charsets=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."io.quarkiverse.mcp".level=DEBUG
quarkus.log.console.stderr=true
quarkus.log.console.enable=true
quarkus.log.use-json=false
