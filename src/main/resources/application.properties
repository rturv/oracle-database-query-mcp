# Quarkus - Oracle JDBC Connection
quarkus.datasource.db-kind=oracle
quarkus.datasource.jdbc.url=${JDBC_URL:jdbc:oracle:thin:@localhost:1521/ORCLPDB1}
quarkus.datasource.username=${JDBC_USER:mcp_user}
quarkus.datasource.password=${JDBC_PASSWORD:password}

# Quarkus MCP Server Configuration
quarkus.mcp.server.name=oracle-mcp-server
quarkus.mcp.server.version=1.0.0

# Logging
quarkus.log.level=INFO
quarkus.log.category."io.quarkiverse.mcp".level=DEBUG
